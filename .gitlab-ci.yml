# glr CI: dogfood gla templates for check, lint, and test coverage.
#
# gla templates are included from the gla repo via GitLab's
# cross-project include mechanism.

stages:
  - build
  - lint
  - test

include:
  - project: example-group/gla
    ref: main
    file:
      - templates/workflow.yml
      - templates/check-package.yml
      - templates/lint.yml
      - templates/test-coverage.yml
